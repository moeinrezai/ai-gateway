services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-gateway-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-gateway-network

  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-gateway-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-gateway-backend
    env_file:
      - ../.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-gateway-network
    restart: unless-stopped

  locust-master:
    image: locustio/locust:latest
    container_name: ai-gateway-locust-master
    ports:
      - "8089:8089" 
      - "5557:5557" 
    volumes:
      - ../locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --master -H http://backend:8000
    depends_on:
      - backend
    networks:
      - ai-gateway-network

  locust-worker:
    image: locustio/locust:latest
    
    volumes:
      - ../locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    depends_on:
      - locust-master
    networks:
      - ai-gateway-network
    deploy:
      replicas: 2 

volumes:
  postgres_data:
  redis_data:

networks:
  ai-gateway-network:
    driver: bridge